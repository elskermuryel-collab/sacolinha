name: Build APK de HTML Local

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Gravar número da versão
        run: echo "${{ github.run_number }}" > www/version.txt

      - name: Salvar version.txt no repositório (necessário para o app checar via raw.githubusercontent.com)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add www/version.txt
          git diff --cached --quiet || git commit -m "Atualiza version.txt para ${{ github.run_number }} [skip ci]"
          git push || echo "Nada novo para enviar"

      - name: Criar package.json e instalar Capacitor
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npm install @capacitor/filesystem @capacitor/file-transfer @capawesome-team/capacitor-file-opener

      - name: Inicializar e Sincronizar Projeto Android
        run: |
          npx cap init "Sacolinha" "com.bramu.sacolinha" --web-dir www
          npx cap add android
          npx cap sync android

      - name: Habilitar download + instalação automática da atualização
        run: |
          # Permissão que deixa o app pedir pra instalar o APK baixado sem
          # precisar passar pela tela extra de "permitir fontes desconhecidas".
          sed -i '/android.permission.INTERNET/a\    <uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES" />' android/app/src/main/AndroidManifest.xml

          # Arquivo exigido pelo plugin de abrir/instalar arquivo (FileProvider),
          # que informa quais pastas do app podem ser compartilhadas com o
          # instalador de pacotes do Android.
          mkdir -p android/app/src/main/res/xml
          cat > android/app/src/main/res/xml/file_paths.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <paths xmlns:android="http://schemas.android.com/apk/res/android">
              <cache-path name="cache" path="." />
              <files-path name="files" path="." />
              <external-files-path name="external-files" path="." />
              <external-cache-path name="external-cache" path="." />
          </paths>
          EOF

      - name: Aplicar ícone do app (usa resources/icon.png, icon-foreground.png e icon-background.png)
        run: |
          npm install @capacitor/assets
          npx capacitor-assets generate --android
          npx cap sync android

      - name: Fixar versionCode crescente (evita conflito de "downgrade" na instalação)
        run: |
          sed -i "s/versionCode [0-9]*/versionCode ${{ github.run_number }}/" android/app/build.gradle
          sed -i "s/versionName \"[^\"]*\"/versionName \"1.${{ github.run_number }}\"/" android/app/build.gradle

      - name: Corrigir conflito de dependência Kotlin
        run: |
          cat <<'EOF' >> android/app/build.gradle

          configurations.all {
              exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
              exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
          }
          EOF

      - name: Usar chave de assinatura fixa (evita precisar desinstalar)
        run: |
          mkdir -p ~/.android
          cp debug.keystore ~/.android/debug.keystore

      - name: Dar permissão de execução ao Gradle
        run: chmod +x android/gradlew

      - name: Compilar o APK
        run: cd android && ./gradlew assembleDebug --no-daemon

      - name: Publicar Release automaticamente
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Última versão"
          files: |
            android/app/build/outputs/apk/debug/app-debug.apk
            www/version.txt
