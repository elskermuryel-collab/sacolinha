name: Build APK de HTML Local

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Criar package.json e instalar Capacitor
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Inicializar e Sincronizar Projeto Android
        run: |
          npx cap init "Sacolinha App" "com.bramu.sacolinha" --web-dir www
          npx cap add android
          npx cap sync android

      - name: Dar permissão de execução ao Gradle
        run: chmod +x android/gradlew

      - name: Compilar o APK
        run: cd android && ./gradlew assembleDebug --no-daemon

      - name: Upload do APK
        uses: actions/upload-artifact@v4
        with:
          name: sacolinha-html-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk